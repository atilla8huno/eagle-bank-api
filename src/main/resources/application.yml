spring:
  application:
    name: eagle-bank-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:mem:eaglebank;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

eaglebank:
  security:
    jwt:
      secret: "eagle-bank-barclays-super-secret-signing-key-256-bits-minimum-2026"
      issuer: "https://auth.eaglebank.com"
      expiration-seconds: 3600

logging:
  pattern:
    level: "%5p [correlationId=%X{correlationId:-}]"
